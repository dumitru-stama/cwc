# CWC — Minimal Configuration
#
# Sensible defaults for getting started. Works with llama.cpp on localhost.
# Copy this to your project root as cwc.toml and adjust as needed.

[mode]
mode = "simple"                          # "simple" or "complex" (complex adds cross-encoder rerank + CoVe verification)

[model]
llm_endpoint = "http://localhost:8080"   # llama.cpp or vLLM server
embedding_model = "models/bge-small-en-v1.5.onnx"
context_window = 4096
max_output_tokens = 1024

[retrieval]
dense_top_k = 50
sparse_top_k = 50
final_top_k = 10
mmr_lambda = 0.7                         # 0.0 = max diversity, 1.0 = max relevance

[budget]
instruction_fraction = 0.15
sources_fraction = 0.65
memory_fraction = 0.10
output_fraction = 0.10

[verify]
check_citations = true
check_schema = true
check_abstention = true

[paths]
data_dir = "data"
index_dir = "index"
models_dir = "models"
