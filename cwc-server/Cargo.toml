[package]
name = "cwc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP API server with REST endpoints and SSE streaming for the Context Window Compiler"
authors = ["Dumitru Stama"]

[[bin]]
name = "cwc-serve"
path = "src/main.rs"

[dependencies]
cwc-core = { path = "../cwc-core" }
cwc-index = { path = "../cwc-index" }
cwc-llm = { path = "../cwc-llm" }
cwc-session = { path = "../cwc-session" }
cwc-cli = { path = "../cwc-cli" }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
clap = { version = "4", features = ["derive"] }
