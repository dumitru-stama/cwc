[package]
name = "cwc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and pipeline orchestrator for the Context Window Compiler"
authors = ["Dumitru Stama"]

[dependencies]
cwc-core = { path = "../cwc-core" }
cwc-ingest = { path = "../cwc-ingest" }
cwc-index = { path = "../cwc-index" }
cwc-embed = { path = "../cwc-embed" }
cwc-retrieve = { path = "../cwc-retrieve" }
cwc-compile = { path = "../cwc-compile" }
cwc-llm = { path = "../cwc-llm" }
cwc-verify = { path = "../cwc-verify" }
cwc-memory = { path = "../cwc-memory" }
cwc-eval = { path = "../cwc-eval" }
cwc-session = { path = "../cwc-session" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
